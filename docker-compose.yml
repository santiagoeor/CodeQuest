version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codequest_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_KEY=${APP_KEY:-base64:r96WLDGpwDbV1c19efgb2pMQ3hPiPJEZFecWJONOuws=}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4200}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-codequest}
      - DB_USERNAME=${DB_USERNAME:-codequest}
      - DB_PASSWORD=${DB_PASSWORD:-codequest_secret}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - codequest-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codequest_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - codequest-network

  db:
    image: mysql:8.0
    container_name: codequest_db
    restart: unless-stopped
    # Port not exposed to host to avoid conflict with local MySQL.
    # Backend connects via Docker internal network (host: db, port: 3306).
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-codequest}
      MYSQL_USER: ${DB_USERNAME:-codequest}
      MYSQL_PASSWORD: ${DB_PASSWORD:-codequest_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - codequest-network

volumes:
  db_data:
    driver: local

networks:
  codequest-network:
    driver: bridge
